<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>清研霍格精工拓客智能体 - 空白复核台</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">清研霍格精工拓客智能体</p>
        <h1>客户经理复核台</h1>
      </div>
      <div class="run-meta">
        <span id="runMode">-</span>
        <strong id="runId">-</strong>
        <span id="runUpdated">-</span>
      </div>
    </header>

    <main class="layout">
      <section class="overview" aria-label="运行概览">
        <div class="metric">
          <span>线索总数</span>
          <strong id="metricTotal">0</strong>
        </div>
        <div class="metric">
          <span>A 类以上</span>
          <strong id="metricHot">0</strong>
        </div>
        <div class="metric">
          <span>公开联系方式</span>
          <strong id="metricContacts">0</strong>
        </div>
        <div class="metric">
          <span>待人工确认</span>
          <strong id="metricReview">0</strong>
        </div>
      </section>

      <section class="workflow" aria-label="工作流进度">
        <div class="section-title">
          <h2>工作流进度</h2>
          <span id="workflowStatus">-</span>
        </div>
        <ol id="workflowSteps" class="steps"></ol>
      </section>

      <section class="workspace">
        <aside class="lead-pane" aria-label="线索列表">
          <div class="toolbar">
            <label class="search">
              <span>搜索</span>
              <input id="searchInput" type="search" placeholder="学校、实验室、信号、联系人" />
            </label>
            <div class="filter-row">
              <label>
                <span>优先级</span>
                <select id="priorityFilter">
                  <option value="all">全部</option>
                  <option value="A+">A+</option>
                  <option value="A">A</option>
                  <option value="B">B</option>
                  <option value="C">C</option>
                  <option value="D">D</option>
                </select>
              </label>
              <label>
                <span>复核</span>
                <select id="reviewFilter">
                  <option value="all">全部</option>
                  <option value="待人工确认">待人工确认</option>
                  <option value="可联系">可联系</option>
                  <option value="暂缓">暂缓</option>
                  <option value="需补证据">需补证据</option>
                </select>
              </label>
            </div>
            <div class="toolbar-actions">
              <label class="file-button small">
                导入 JSON
                <input id="jsonImport" type="file" accept="application/json,.json" />
              </label>
            </div>
          </div>
          <div id="leadList" class="lead-list"></div>
        </aside>

        <section class="detail-pane" aria-label="线索详情">
          <div id="emptyState" class="empty-state">
            <h2>等待导入运行结果</h2>
            <p>此页面不加载任何默认线索数据。请从左侧导入由主控编排 agent 生成的 JSON 后查看复核内容。</p>
          </div>

          <article id="leadDetail" class="lead-detail" hidden>
            <div class="detail-header">
              <div>
                <p id="leadOrg" class="eyebrow">-</p>
                <h2 id="leadTitle">-</h2>
              </div>
              <div class="score-box">
                <span id="leadPriority">-</span>
                <strong id="leadScore">0</strong>
              </div>
            </div>

            <nav class="tabs" aria-label="详情分组">
              <button class="tab active" data-tab="card">客户卡片</button>
              <button class="tab" data-tab="contacts">联系方式</button>
              <button class="tab" data-tab="evidence">证据链</button>
              <button class="tab" data-tab="copy">话术</button>
              <button class="tab" data-tab="review">人工复核</button>
            </nav>

            <div class="tab-panel active" id="tab-card">
              <div class="field-grid" id="cardFields"></div>
              <div class="text-block">
                <h3>评分理由</h3>
                <p id="scoreReason">-</p>
              </div>
            </div>

            <div class="tab-panel" id="tab-contacts">
              <div class="contact-summary" id="contactSummary"></div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>类型</th>
                      <th>联系方式</th>
                      <th>状态</th>
                      <th>来源</th>
                      <th>证据片段</th>
                    </tr>
                  </thead>
                  <tbody id="contactRows"></tbody>
                </table>
              </div>
            </div>

            <div class="tab-panel" id="tab-evidence">
              <div id="evidenceList" class="evidence-list"></div>
            </div>

            <div class="tab-panel" id="tab-copy">
              <div class="copy-grid">
                <section>
                  <h3>首封邮件标题</h3>
                  <p id="emailSubject">-</p>
                </section>
                <section>
                  <h3>首封邮件正文</h3>
                  <p id="emailBody">-</p>
                </section>
                <section>
                  <h3>微信开场白</h3>
                  <p id="wechatOpening">-</p>
                </section>
                <section>
                  <h3>电话开场白</h3>
                  <p id="phoneOpening">-</p>
                </section>
              </div>
            </div>

            <div class="tab-panel" id="tab-review">
              <form id="reviewForm" class="review-form">
                <label>
                  <span>复核结论</span>
                  <select id="reviewStatus">
                    <option value="待人工确认">待人工确认</option>
                    <option value="可联系">可联系</option>
                    <option value="暂缓">暂缓</option>
                    <option value="需补证据">需补证据</option>
                  </select>
                </label>
                <label>
                  <span>客户经理</span>
                  <input id="accountManager" type="text" placeholder="姓名" />
                </label>
                <label>
                  <span>下次跟进时间</span>
                  <input id="nextFollowUp" type="date" />
                </label>
                <label class="wide">
                  <span>复核备注</span>
                  <textarea id="reviewNote" rows="5" placeholder="记录判断依据、需要补证据的位置或跟进建议"></textarea>
                </label>
                <div class="form-actions">
                  <button type="submit">保存复核</button>
                  <button type="button" id="exportReview">导出复核记录</button>
                </div>
              </form>
            </div>
          </article>
        </section>
      </section>
    </main>

    <script>
      window.QH_LATEST_RUN = {
        run_id: "FRAMEWORK-ONLY",
        run_mode: "空白框架 - 等待导入 JSON",
        generated_at: "",
        status: "等待导入",
        workflow: [
          { name: "目标画像", status: "pending" },
          { name: "公开采集", status: "pending" },
          { name: "信号识别", status: "pending" },
          { name: "动态评分", status: "pending" },
          { name: "联系人", status: "pending" },
          { name: "客户卡片", status: "pending" },
          { name: "人工复核", status: "pending" }
        ],
        leads: []
      };
    </script>
    <script src="./app.js"></script>
  </body>
</html>
